### MIO

 VEN_orinoco_petrochem: "Orinoco Petrochemicals"
 VEN_orinoco_petrochem_desc: "Expand downstream refining, plastics, and fertilizer production to capture higher value-added margins from hydrocarbon reserves."
 VEN_clean_nuclear_grid: "Clean & Nuclear Power Grid"
 VEN_clean_nuclear_grid_desc: "Modernize the national electrical grid with high-capacity hydroelectric, solar, and peaceful nuclear generation."
 VEN_guayana_metallurgy: "Guayana Heavy Metallurgy"
 VEN_guayana_metallurgy_desc: "Revitalize steel, aluminum, and iron ore processing across the Guayana industrial belt."
 VEN_guayana_rare_earths: "Guayana Rare Earths"
 VEN_guayana_rare_earths_desc: "Develop strategic mining and processing of coltan, rare earths, and critical minerals for high-tech industries."
 VEN_industrial_corridors: "Industrial Corridors"
 VEN_industrial_corridors_desc: "Connect manufacturing hubs, ports, and railways into integrated logistics and production corridors."
 VEN_special_econ_zones: "Special Economic Zones"
 VEN_special_econ_zones_desc: "Establish tax-incentivized export and manufacturing zones along key coastal and border hubs."
 VEN_agro_sovereignty: "Agro-Industrial Sovereignty"
 VEN_agro_sovereignty_desc: "Mechanize agriculture and expand food processing across the Llanos to achieve domestic food security and export surpluses."
 VEN_caribbean_tourism: "Caribbean Tourism"
 VEN_caribbean_tourism_desc: "Transform Margarita, Los Roques, and the Caribbean coast into premier international eco-tourism and hospitality destinations."
 VEN_digital_finance_hub: "Digital & FinTech Hub"
 VEN_digital_finance_hub_desc: "Build high-speed fiber infrastructure, data centers, and modern digital banking frameworks."
 VEN_talent_and_rd_hub: "Global Talent & R&D Hub"
 VEN_talent_and_rd_hub_desc: "Invest in universities, technical institutes, and research parks to retain and attract top scientific and engineering talent."
 VEN_sovereign_fund: "Sovereign Wealth Fund"
 VEN_sovereign_fund_desc: "Channel diversified national surpluses into a long-term sovereign wealth fund, securing prosperity for future generations."
 VEN_army_guerrilla: "Guerrilla Doctrine"
 VEN_army_guerrilla_desc: "Organize decentralized popular resistance cells and militia networks capable of waging prolonged asymmetric warfare across all terrains."
 VEN_army_asymmetric: "Asymmetric Defense Network"
 VEN_army_asymmetric_desc: "Establish concealed arms caches, urban ambush protocols, and flexible command-and-control to bleed any invading force."
 VEN_army_jungle_warfare: "Orinoco & Jungle Warfare"
 VEN_army_jungle_warfare_desc: "Train specialized infantry brigades in deep-jungle survival, riverine infiltration, and border defense."
 VEN_army_elite_doctrine: "Elite Force Doctrine"
 VEN_army_elite_doctrine_desc: "Transition toward a compact, highly trained, technologically superior professional force modeled on rapid-response elite militaries."
 VEN_army_specops_cmd: "Special Ops Command"
 VEN_army_specops_cmd_desc: "Unify commando, paratrooper, and counter-terrorism units under a single high-readiness strategic strike command."
 VEN_army_elite_c4isr: "Tactical C4ISR & EW"
 VEN_army_elite_c4isr_desc: "Equip our elite units with encrypted battlefield communications, tactical reconnaissance, and electronic warfare systems."
 VEN_army_firepower: "Firepower & Shock Doctrine"
 VEN_army_firepower_desc: "Adopt an overwhelming firepower doctrine focused on artillery supremacy, coordinated salvos, and rapid suppression."
 VEN_army_mobile_arty: "Mobile Artillery"
 VEN_army_mobile_arty_desc: "Expand mobile and self-propelled artillery batteries with dedicated prime movers to keep pace with advancing columns."
 VEN_army_counter_battery: "Counter-Battery Radar"
 VEN_army_counter_battery_desc: "Integrate fire-direction centers, ballistic computers, and precision ammunition to silence enemy batteries."
 VEN_air_usa_alignment: "Western Aerospace Alignment"
 VEN_air_usa_alignment_desc: "Re-establish technical, logistical, and doctrinal ties with United States and Western defense manufacturers."
 VEN_air_f16_f35_licenses: "US Fighter Package"
 VEN_air_f16_f35_licenses_desc: "Procure an all-inclusive $21.75B US defense package: 48 F-16V Block 70/72 fighters, production licenses, air defense and radar installations, electronics/computing R&D, and pilot training."
 VEN_air_russia_alignment: "Russian Aerospace Alignment"
 VEN_air_russia_alignment_desc: "Deepen military aviation cooperation with Russian aerospace and air defense bureaus."
 VEN_air_su30_package: "Russian Su-30 Package"
 VEN_air_su30_package_desc: "Acquire a comprehensive $17.25B Russian package: 48 Su-30MK2 heavy fighters with production licenses, layered SAM and radar sites, electronic warfare R&D, and pilot training."
 VEN_air_neutral_autonomy: "Autonomous Aero Base"
 VEN_air_neutral_autonomy_desc: "Pursue independent maintenance, avionics integration, and non-aligned procurement free from superpower embargoes."
 VEN_air_fx_ven_tender: "FX-VEN Fighter Tender"
 VEN_air_fx_ven_tender_desc: "Launch a competitive international tender among European manufacturers—Saab Gripen, Dassault Rafale, and Eurofighter Typhoon—for a full multirole fighter package."
 VEN_air_asymmetric: "Asymmetric Air Doctrine"
 VEN_air_asymmetric_desc: "Secure local production licensing and deeper military ties with the FX-VEN tender winner while deploying highway dispersal strips."
 venezuela.210.t: "FX-VEN International Fighter Competition"
 venezuela.210.d: "Following months of technical evaluations and flight trials at El Libertador Air Base (BAEL) in Maracay, the Venezuelan Air Force Evaluation Commission has submitted its final report for the FX-VEN multirole fighter tender. To avoid superpower dependency and potential arms embargoes, Caracas invited three European consortia to submit turnkey fleet packages—including airframes, precision munitions, spare parts, simulator training, and subsequent local license assembly through CAVIM.\n\nSaab's JAS 39 Gripen offers the lowest operating cost and rugged highway-strip capability; Dassault's Rafale brings superior twin-engine payload and deep-strike reach; and the Eurofighter Typhoon delivers unmatched high-altitude interception performance at a premium price."
 venezuela.210.a: "Saab JAS 39 Gripen — 30 fighters, rugged & economical ($9.0B)"
 venezuela.210.b: "Dassault Rafale — 24 omnirole twin-engine fighters ($11.7B)"
 venezuela.210.c: "Eurofighter Typhoon — 24 high-altitude interceptors ($12.0B)"
 VEN_air_sam_network: "Integrated SAM Network"
 VEN_air_sam_network_desc: "Link long-range SAM batteries, mobile radars, and command centers into a layered national air defense shield."
 VEN_air_drone_command: "Drone Warfare Command"
 VEN_air_drone_command_desc: "Establish dedicated reconnaissance, loitering munition, and armed UAV squadrons for persistent ISR and strike."
 VEN_air_missile_shield: "Missile Defense Shield"
 VEN_air_missile_shield_desc: "Harden military telecommunications, satellite uplinks, and ballistic/cruise missile early-warning systems."
 VEN_air_bael_upgrade: "BAEL Airbase Modernization"
 VEN_air_bael_upgrade_desc: "Upgrade El Libertador Air Base in Maracay and strategic forward runways with hardened shelters and modern logistics."
 VEN_air_nato_interop: "Western EW & F-35"
 VEN_air_nato_interop_desc: "Adopt Western datalink standards, airborne early warning and stealth R&D, radar networks, 12 additional F-16V aircraft, and deeper US military cooperation."
 VEN_air_supremacy: "Joint Aerospace Supremacy"
 VEN_air_supremacy_desc: "Consolidate combat air wings, integrated air defense, fifth-generation stealth & BVR weapons research, and CAVIM industrial support into a permanent national aerospace doctrine."
 VEN_joint_aerospace_supremacy_idea: "Joint Aerospace Supremacy"
 VEN_joint_aerospace_supremacy_idea_desc: "Unified command, superior pilot training, and streamlined logistics give the Venezuelan Air Force decisive operational reach."
 VEN_air_guayana_alloys: "Guayana Aerospace Alloys"
 VEN_air_guayana_alloys_desc: "Expand CVG aluminum, steel, tungsten, and chromium smelting in Guayana to supply domestic airframes and turbine blades free from foreign embargoes."
 VEN_air_ucv_usb_labs: "UCV & USB Aero Labs"
 VEN_air_ucv_usb_labs_desc: "Partner with the Central University of Venezuela and Simón Bolívar University to establish sovereign avionics, computing, and propulsion laboratories."
 VEN_air_design_bureau: "CAVIM National Design Bureau"
 VEN_air_design_bureau_desc: "Consolidate Venezuelan aeronautical engineers at El Libertador Air Base to select our flagship domestic combat platform and begin prototype trials."
 VEN_air_propulsion: "Domestic Turbines & Missiles"
 VEN_air_propulsion_desc: "Develop indigenous jet engines, BVR air-to-air missiles, and hypersonic propulsion research inside Venezuela."
 VEN_air_avionics_radar: "National AESA & EW Systems"
 VEN_air_avionics_radar_desc: "Engineer domestic AESA airborne radars, AWACS suites, and electronic countermeasures at Maracay and Caracas."
 VEN_air_sovereign_hub: "Sovereign Aerospace Complex"
 VEN_air_sovereign_hub_desc: "Unite Guayana's heavy metallurgy, Maracay's assembly lines, and Venezuelan universities into a self-sufficient regional aerospace powerhouse."
 VEN_national_aerospace_initiative_idea: "National Aerospace Initiative"
 VEN_national_aerospace_initiative_idea_desc: "Initial state investments in Maracay and Guayana are laying the foundations for domestic aircraft manufacturing."
 VEN_sovereign_aerospace_complex_idea: "Sovereign Aerospace Complex"
 VEN_sovereign_aerospace_complex_idea_desc: "Full integration of Guayana alloys, university R&D, and CAVIM production lines drastically reduces domestic aircraft costs while boosting performance."
 VEN_cavim_mio_guayana_alloys: "Guayana Aerospace Alloys"
 VEN_cavim_mio_national_airframes: "National Combat Airframes"
 VEN_cavim_mio_turbines_missiles: "Domestic Turbines & Missiles"
 venezuela.211.t: "CAVIM National Design Bureau: Flagship Platform"
 venezuela.211.d: "Engineers from Maracay, Guayana, UCV, and USB have completed wind-tunnel testing for Venezuela's first fully sovereign combat aircraft program. Before tooling the assembly lines at BAEL, the High Command must select which flagship prototype will lead our national aerospace industry—each platform can subsequently be customized and upgraded in our aircraft designer."
 venezuela.211.a: "CAVIM F-21 Relámpago — Supersonic Stealth Multirole Fighter (6 prototypes)"
 venezuela.211.b: "CAVIM B-24 Caroní — Heavy Long-Range Strike Bomber (4 prototypes)"
 venezuela.211.c: "CAVIM AH-14 Roraima — Heavy Attack Helicopter & Drone Gunship (12 prototypes)"
 VEN_air_auto_drones: "CAVIM Drones & Exoskeletons"
 VEN_air_auto_drones_desc: "Fund CAVIM's next-generation fiber-optic drone swarms, autonomous combat frameworks, and infantry exoskeleton prototypes."
 VEN_air_orbital_cmd: "ABAE Orbital Command"
 VEN_air_orbital_cmd_desc: "Expand Venezuela's space launch capability, deploy new Venesat communications and reconnaissance satellites, and pursue hypersonic cruise missiles."
 VEN_air_energy_shield: "Directed-Energy Shield"
 VEN_air_energy_shield_desc: "Integrate naval/air point-defense lasers, railguns, stealth airframes, and orbital defense platforms into a unified strategic deterrent."
 VEN_orinoco_fusion: "Orinoco Fusion Grid"
 VEN_orinoco_fusion_desc: "Channel sovereign wealth into thorium fuel cycles, experimental fusion reactors, utility-scale battery storage, and a resilient national smart grid."
 VEN_guayana_chips: "Guayana Microchips"
 VEN_guayana_chips_desc: "Transform Guayana's rare-earth reserves into domestic microchip foundries and advanced composite manufacturing lines."
 VEN_sebin_cyber_cmd: "SEBIN Cyber Command"
 VEN_sebin_cyber_cmd_desc: "Modernize SEBIN into a full-spectrum cyber command with hardened military networks and post-quantum encryption."
 VEN_vertical_farming: "Biotech Farming"
 VEN_vertical_farming_desc: "Combine vertical agriculture, crop-protection reforms, and epigenetic biotechnology to guarantee permanent food sovereignty."
 VEN_robotics_ai: "Robotics & AI"
 VEN_robotics_ai_desc: "Deploy industrial robotics, humanoid automation, and advanced artificial intelligence across Venezuela's factories and hospitals."
 VEN_tech_singularity: "Technological Singularity"
 VEN_tech_singularity_desc: "Unite clean wireless power, AI-driven productivity, and global capital inflows to shed sanctions and propel Venezuela into the post-oil era."
 VEN_gnb_zone_commands: "GNB Zone Commands"
 VEN_gnb_zone_commands_desc: "Organize regional National Guard Zone Commands (CZGNB) to secure lines of communication, slash garrison manpower overhead, and unlock rapid territorial stabilization operations."
 VEN_gnb_pacification: "Pacification & Integration"
 VEN_gnb_pacification_desc: "Establish civil-military coordination teams to quell insurgency in newly occupied or annexed regions, accelerate compliance, and integrate local manpower."
 VEN_gnb_border_forts: "Border & Zone Fortifications"
 VEN_gnb_border_forts_desc: "Reinforce strategic frontiers across Coastal Venezuela, Guayana, and Apure with hardened strongpoints, rapid entrenchment works, and deep defense protocols."
 VEN_gnb_light_armor: "Tactical Light Armor"
 VEN_gnb_light_armor_desc: "Equip National Guard regiments with tactical utility vehicles, light armored patrol units, and small arms reserves to deploy swiftly across highways, borders, and contested zones."
 VEN_gnb_intel_centers: "Territorial Intel"
 VEN_gnb_intel_centers_desc: "Deploy regional intelligence cells to detect sabotage, safeguard national stability, and deny enemy occupation forces any foothold."
 VEN_gnb_security_system: "Territorial Security System"
 VEN_gnb_security_system_desc: "Consolidate all National Guard doctrines into a unified strategic shield guaranteeing national stability, core defense, and seamless stabilization of conquered lands."
