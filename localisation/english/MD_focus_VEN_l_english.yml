 VEN_gnb_integrated_territory_modifier: "Territorial System Integration"
 VEN_gnb_territorial_commands: "National Guard: Territorial Commands"
 VEN_gnb_territorial_commands_desc: "Deploy Regional National Guard Commands to pacify occupied regions, integrate stabilized territories, mobilize zone brigades in wartime, and run territorial shield operations."
 VEN_gnb_pacify_occupied_state: "Pacify [From.GetName]"
 VEN_gnb_pacify_occupied_state_desc: "Dispatch National Guard stabilization detachments to [From.GetName] to suppress resistance and accelerate local compliance."
 VEN_gnb_integrate_pacified_state: "Integrate [From.GetName] into Territorial System"
 VEN_gnb_integrate_pacified_state_desc: "With resistance suppressed and compliance established, formally integrate [From.GetName] into the Territorial Security System, boosting local resources, manpower, and construction capacity."
 VEN_gnb_activate_zone_brigade: "Mobilize Zone Brigade in [From.GetName]"
 VEN_gnb_activate_zone_brigade_desc: "Activate a combat-ready National Guard brigade in [From.GetName] to defend the homeland during war or heightened global tension."
 VEN_gnb_operation_territorial_shield: "Operation Territorial Shield"
 VEN_gnb_operation_territorial_shield_desc: "Conduct nationwide readiness and internal defense maneuvers to strengthen stability, core defense, and anti-insurgency control."
 VEN_gnb_unlock_territorial_commands_tt: "Unlocks §YNational Guard: Territorial Commands§! decisions (Pacify Occupied States, Mobilize Zone Brigades, and Operation Territorial Shield)."
 VEN_gnb_unlock_state_integration_tt: "Enhances §YPacify State§! operations (+16% Compliance, -20% Resistance) and unlocks §YIntegrate Pacified State§! on-map decisions once a region reaches 50% Compliance."
 VEN_gnb_sovereign_order_consolidates_tt: "Consolidates all prior National Guard bonuses into §YIntegral Territorial Security System§!."
 # Army Reform Ideas & Tooltips
 VEN_cavim_production_idea: "CAVIM Industrial Expansion"
 VEN_cavim_production_idea_desc: "Expanded military production lines under CAVIM accelerate factory efficiency and equipment output."
 VEN_army_asymmetric_idea: "Asymmetric Territorial Defense"
 VEN_army_asymmetric_idea_desc: "Decentralized logistics and guerrilla cells inflict heavy attrition on any invader."
 VEN_army_special_ops_idea: "Joint Special Operations Command"
 VEN_army_special_ops_idea_desc: "An expanded special forces corps trained to operate deep behind enemy lines."
 VEN_spirit_of_bolivar_idea: "Spirit of the Liberator"
 VEN_spirit_of_bolivar_idea_desc: "Overwhelming artillery firepower and decisive offensive planning inspired by Bolivar's campaigns."
 VEN_joint_exercises_idea: "Unified General Staff"
 VEN_joint_exercises_idea_desc: "Inter-branch coordination raises command capacity and operational doctrine mastery."
