 VEN_elite_c4isr_idea: "Tactical C4ISR Network"
 VEN_elite_c4isr_idea_desc: "Encrypted communications and real-time reconnaissance boost unit initiative and doctrine adoption."
 # Navy Overhaul
 VEN_navy_dianca_plan: "DIANCA Sovereignty Plan"
 VEN_navy_dianca_plan_desc: "Instead of relying on a superpower, we will rebuild DIANCA through independent technical tenders and national capital—a harder, costlier road that preserves full sovereignty."
 VEN_navy_swedish_subs: "Swedish Submarines"
 VEN_navy_swedish_subs_desc: "Contracting neutral Nordic naval engineers gives our submarine force quiet hull acoustics, modern torpedoes, and technical independence."
 VEN_navy_navantia_hulls: "Navantia Offshore Hulls"
 VEN_navy_navantia_hulls_desc: "Commissioning modern Guaiquerí-class offshore patrol hulls from Spain's Navantia gives DIANCA the blueprints and shipyard capacity to assemble major surface combatants."
 VEN_navy_hybrid_armament: "Hybrid Weapons Integration"
 VEN_navy_hybrid_armament_desc: "When Western embargoes block missile and radar deliveries, our engineers will integrate alternative non-aligned weapon systems and sensors onto our Navantia-built hulls."
 VEN_navy_oriente_bases: "Oriente Naval Bases"
 VEN_navy_oriente_bases_desc: "Expanding dockyards and fleet anchorages in Sucre-Anzoátegui anchors our Atlantic projection and protects eastern maritime trade."
 VEN_navy_sovereign: "The Sovereign Armada"
 VEN_navy_sovereign_desc: "With self-reliant shipyards, hybrid-armed patrol fleets, and silent submarines, the Bolivarian Navy answers to Caracas alone."
 VEN_navy_us_mission: "U.S. Naval Advisory Mission"
 VEN_navy_us_mission_desc: "Aligning with Washington opens the door to the world's premier navy—accelerating modernization at the price of growing American political influence."
 VEN_navy_us_license_pact: "U.S. Naval License Pact"
 VEN_navy_us_license_pact_desc: "Direct production licenses and preferential arms agreements allow Venezuelan shipyards to build American hulls at sharply reduced diplomatic and industrial cost."
 VEN_navy_us_shipyards: "American Shipyard Investment"
 VEN_navy_us_shipyards_desc: "U.S. defense contractors finance new dockyards in Puerto Cabello and Maracaibo, rapidly expanding our naval construction capacity."
 VEN_navy_us_gunnery: "U.S. Gunnery & Fire Control"
 VEN_navy_us_gunnery_desc: "American gunnery instructors, combat data links, and fire-control suites dramatically elevate our fleet's accuracy and lethality."
 VEN_navy_us_destroyers: "US Hull & Sub Licenses"
 VEN_navy_us_destroyers_desc: "Washington clears production licenses for modern destroyers and attack submarines, vaulting Venezuela ahead of regional rivals."
 VEN_navy_us_caribbean: "Integrated Caribbean Fleet"
 VEN_navy_us_caribbean_desc: "Venezuela becomes Washington's premier naval bastion in the southern Caribbean—wielding a formidable Blue Water fleet while granting U.S. forces operational access."
 VEN_navy_sovereign_planning_idea: "Independent Naval Reconstruction"
 VEN_navy_sovereign_planning_idea_desc: "DIANCA is rebuilding domestic naval capacity through independent tenders without surrendering foreign policy autonomy."
 VEN_navy_hybrid_armament_idea: "Hybrid Naval Armament"
 VEN_navy_hybrid_armament_idea_desc: "Foreign-built patrol hulls equipped with domestically integrated missiles, radars, and quiet submarine upgrades."
 VEN_navy_sovereign_armada_idea: "Sovereign Bolivarian Armada"
 VEN_navy_sovereign_armada_idea_desc: "A self-reliant naval force built around sovereign shipyards, hybrid surface combatants, and resilient Caribbean deterrence."
 VEN_us_naval_mission_1: "U.S. Naval Advisory Mission"
 VEN_us_naval_mission_1_desc: "American naval advisors are restructuring fleet doctrine and opening Western license channels while deepening U.S. influence."
 VEN_us_naval_mission_2: "U.S.-Financed Dockyards"
 VEN_us_naval_mission_2_desc: "American capital and licensed shipbuilding standards rapidly accelerate Venezuelan naval production."
 VEN_us_naval_mission_3: "U.S. Naval Gunnery & C4ISR"
 VEN_us_naval_mission_3_desc: "American fire-control systems and gunnery training give Venezuelan warships lethal precision."
 VEN_us_caribbean_fleet_idea: "Integrated Caribbean Fleet"
 VEN_us_caribbean_fleet_idea_desc: "Equipped with U.S. licenses, gunnery doctrine, and deep shipyard investment, the fleet projects formidable Blue Water power alongside Washington."
 VEN_USA_Naval_License_Agreement: "U.S.-Venezuelan Naval License Pact"
 VEN_navy_drydocks: "National Drydock Engineering"
 VEN_navy_drydocks_desc: "Expanding Maracaibo's drydocks and training domestic marine engineers reduces our long-term dependence on foreign shipyards."
 VEN_navy_sabalo_refit: "Sábalo-Class Overhaul"
 VEN_navy_sabalo_refit_desc: "Overhauling our Type-209 submarines with modern sensors, quiet propulsion, and extended patrol endurance turns them into lethal Caribbean hunters."
 VEN_navy_sea_logistics: "PDVSA Maritime Logistics"
 VEN_navy_sea_logistics_desc: "Integrating auxiliary tankers, convoy escorts, and replenishment vessels ensures our fleet can sustain prolonged operations."
 VEN_navy_mine_warfare: "Caribbean Mine Warfare"
 VEN_navy_mine_warfare_desc: "Smart naval mines and fast torpedo craft turn Venezuela's coastal approaches into an asymmetric kill zone for invading fleets."
 VEN_navy_coast_missiles: "Coastal Anti-Ship Batteries"
 VEN_navy_coast_missiles_desc: "Fortifying Puerto Cabello and Oriente with hardened coastal missile and defense batteries shields our dockyards from naval strikes."
 VEN_navy_academy: "Bolivarian Naval Academy"
 VEN_navy_academy_desc: "Consolidating our officer corps, naval doctrine, and DIANCA engineering teams under a unified autonomous command."
 VEN_armor_mech_cmd: "CEMABLIN Doctrine"
 VEN_armor_mech_cmd_desc: "Expand the Armored Maintenance Center (CEMABLIN) at Fort Paramacay in Valencia to reorganize Venezuela's tanks, IFVs, and motorized brigades."
 VEN_armor_eastern_pact: "Eastern Armor Pact"
 VEN_armor_eastern_pact_desc: "Turn to Russian and Belarusian defense contractors to acquire T-72B1V main battle tanks, BMP-3M IFVs, and BTR-80A carriers to bypass Western embargoes."
 VEN_motor_tiuna_fleet: "Tiuna Tactical Fleet"
 VEN_motor_tiuna_fleet_desc: "Mass-produce the domestic 4x4 Tiuna utility vehicle at CENARECA in troop-transport, command, and reconnaissance configurations."
 VEN_armor_west_overhaul: "AMX-30VE Overhaul"
 VEN_armor_west_overhaul_desc: "Modernize Venezuela's French and British armored heritage—AMX-30V, AMX-13C90, and Scorpion-90—with digital fire-control computers and new diesel powerpacks."
 VEN_armor_norinco: "NORINCO Amphibious Marines"
 VEN_armor_norinco_desc: "Partner with China's NORINCO to equip mechanized marine battalions with VN-1 8x8 carriers and VN-16/VN-18 amphibious assault vehicles."
 VEN_motor_tiuna_at: "Tiuna Tank Hunters"
 VEN_motor_tiuna_at_desc: "Mount anti-tank guided missiles and heavy machine guns onto Tiuna chassis while expanding motorized supply columns across the Llanos."
 VEN_armor_wheeled_ifv: "8x8 Wheeled IFVs"
 VEN_armor_wheeled_ifv_desc: "Acquire modern Western 8x8 armored personnel carriers and light mechanized cavalry doctrines suited for rapid border deployment."
 VEN_cavim_armor_plant: "Carabobo Armor Plant"
 VEN_cavim_armor_plant_desc: "Build heavy vehicle assembly lines in Carabobo under CAVIM and CENARECA to manufacture spare parts, IFV hulls, and tactical trucks domestically."
 VEN_armor_spearhead: "Llanos Spearhead"
 VEN_armor_spearhead_desc: "Integrate main battle tanks, IFVs, and composite armor upgrades into fast maneuver formations designed to shatter fortified lines."
 VEN_combined_arms_corps: "Combined Arms Armored Corps"
 VEN_combined_arms_corps_desc: "Unify tank regiments, amphibious IFVs, and Tiuna motorized brigades into South America's premier combined-arms mechanized corps."
 VEN_cenareca_unlock_tt: "Unlocks or reinforces the §YCENARECA Armored Organization§! MIO."
 VEN_cemablin_t72_doctrine_idea: "CEMABLIN Heavy Armor Doctrine"
 VEN_cemablin_t72_doctrine_idea_desc: "Russian-inspired heavy tank regiments deliver superior shock firepower and breakthrough."
 VEN_norinco_vn16_amphibious_idea: "NORINCO Amphibious Mechanized Corps"
 VEN_norinco_vn16_amphibious_idea_desc: "Chinese VN-1, VN-16, and VN-18 amphibious armor excels at river crossings and coastal assaults."
 VEN_amx30_modernization_idea: "AMX-30VE Digital Overhaul"
 VEN_amx30_modernization_idea_desc: "Upgraded optics, stabilizers, and engines give our modernized Western tanks high mobility and endurance."
 VEN_llanos_cavalry_mobility_idea: "Llanos Wheeled Cavalry"
 VEN_llanos_cavalry_mobility_idea_desc: "Fast 8x8 mechanized brigades dominate open plains with low logistical strain."
 VEN_tiuna_motorization_idea: "Tiuna Tactical Motorization"
 VEN_tiuna_motorization_idea_desc: "Standardized domestic utility vehicles reduce production costs and improve fleet reliability and marching speed."
 VEN_motorized_logistics_idea: "Motorized Tank-Hunter Columns"
 VEN_motorized_logistics_idea_desc: "Anti-tank Tiuna platoons and dedicated truck convoys cut supply consumption and strengthen motorized formations."
 VEN_cenareca_mass_production_idea: "CENARECA Heavy Assembly"
 VEN_cenareca_mass_production_idea_desc: "Streamlined armored vehicle production lines boost factory output and efficiency retention."
 VEN_armored_spearhead_idea: "Armored Spearhead"
 VEN_armored_spearhead_idea_desc: "Concentrated armored formations strike with superior speed, firepower, and breakthrough."
 VEN_combined_arms_corps_idea: "Combined Arms Armored Corps"
 VEN_combined_arms_corps_idea_desc: "Tanks, IFVs, and motorized infantry fight as a single cohesive fist across every theater."
 VEN_codai_air_defense_idea: "CODAI Integrated Air Defense"
 VEN_codai_air_defense_idea_desc: "Layered SAM batteries and early-warning radars protect Venezuela's skies from hostile airstrikes."
 VEN_drone_recon_strike_idea: "Tactical Drone Command"
 VEN_drone_recon_strike_idea_desc: "Armed reconnaissance UAVs sharpen close air support and battlefield targeting."
 VEN_autonomous_drone_swarm_idea: "Autonomous CAVIM Drone Swarms"
 VEN_autonomous_drone_swarm_idea_desc: "Fiber-optic and autonomous loitering munitions saturate enemy defenses and boost CAS lethality."
 VEN_missile_telecom_shield_idea: "Electronic & Telecom Shield"
 VEN_missile_telecom_shield_idea_desc: "Hardened radar links and encrypted military communications deny enemy intelligence."
 VEN_orbital_c4isr_idea: "Orbital C4ISR Constellation"
 VEN_orbital_c4isr_idea_desc: "Dedicated communications and reconnaissance satellites accelerate strategic planning and research."
 VEN_aerospace_energy_shield_idea: "Aerospace Directed-Energy Shield"
 VEN_aerospace_energy_shield_idea_desc: "Next-generation anti-drone lasers and integrated CODAI batteries create an impenetrable air-defense umbrella."
 VEN_fiscal_overheating_debuff: "Fiscal Overheating & Infrastructure Strain"
 VEN_fiscal_overheating_debuff_desc: "Massive concurrent public works and industrial subsidies strain state finances, consumer supply, and borrowing costs."
 VEN_megaproject_debt_strain: "Megaproject Debt & Capital Strain"
 VEN_megaproject_debt_strain_desc: "Monumental investments in strategic industries and frontier technologies temporarily weigh on fiscal balance and consumer goods."
 VEN_global_talent_hub: "Global Talent & R&D Ecosystem"
 VEN_global_talent_hub_desc: "Universities, technical institutes, and research parks retain skilled Venezuelan engineers and attract international researchers."
 VEN_oil_dependency_transition: "Post-Oil Economic Transition"
 VEN_oil_dependency_transition_desc: "State and private capital are shifting from raw crude dependency toward diversified manufacturing, mining, and services."
 VEN_emirates_of_the_caribbean: "Caribbean Sovereign Prosperity"
