 venezuela.231.t:0 "National Strike at PDVSA"
 venezuela.231.d:0 "Following the corporate board's seizure of power in Caracas, oil workers across Zulia and the Orinoco Belt have walked off the rigs in protest. Refineries are running on skeleton crews while the board demands an immediate resolution."
 venezuela.231.a:0 "Break the picket lines with private security."
 venezuela.231.b:0 "Buy off the union leadership and restore production."
 venezuela.231.c:0 "Purge the strike leaders and install loyal technocrats."
 venezuela.232.t:0 "Multinational Bidding for Venezuelan ZEDEs"
 venezuela.232.d:0 "With labor restrictions abolished and international bankers invited to Caracas, Wall Street funds and U.S. energy majors are offering massive capital injections in exchange for long-term Zulia oil concessions."
 venezuela.232.a:0 "Grant Zulia concessions to U.S. majors for immediate capital."
 venezuela.232.b:0 "Auction financial licenses only and retain full resource rights."
 venezuela.233.t:0 "The Libertarian Shock"
 venezuela.233.d:0 "Dismantling state welfare and central bureaucracy overnight has triggered fierce demonstrations in major cities. Private contractors offer to secure key assets, while advisors suggest issuing equity vouchers to calm the public."
 venezuela.233.a:0 "Deploy private military contractors to guard key infrastructure."
 venezuela.233.b:0 "Distribute private equity vouchers to displaced workers."
 venezuela.234.t:0 "The Caribbean Oil Cartel Summit"
 venezuela.234.d:0 "Having consolidated Venezuela's domestic energy monopoly, the PDVSA Board now looks outward at regional competitors. Caracas can either launch an aggressive price war against Bogotá or co-opt neighboring producers into a Venezuelan-led syndicate."
 venezuela.234.a:0 "Launch a price war and prepare for confrontation."
 venezuela.234.b:0 "Invite regional producers into a Caracas-led energy syndicate."

