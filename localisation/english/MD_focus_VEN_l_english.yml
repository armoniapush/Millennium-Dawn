 venezuela.240.t:0 "The Enabling Act"
 venezuela.240.d:0 "The National Assembly is debating sweeping decree powers for the presidency. Should we rule by unilateral revolutionary decree, or bind the Armed Forces and party cadres into a shared power pact?"
 venezuela.240.a:0 "Rule by revolutionary decree!"
 venezuela.240.b:0 "Forge a pact with the FANB and party cadres."
 venezuela.241.t:0 "Caracas Requests a Security Pact"
 venezuela.241.d:0 "Venezuela's socialist government has requested formal entry into Russia's Collective Security framework and asked for urgent military-industrial backing in the Caribbean."
 venezuela.241.a:0 "Welcome Caracas into our security umbrella!"
 venezuela.241.b:0 "Send weapons, but avoid formal entanglement."
 venezuela.242.t:0 "The Colectivos & Revolutionary Justice"
 venezuela.242.d:0 "Armed neighborhood colectivos demand full autonomy to enforce price controls and hunt counter-revolutionaries, while senior generals urge bringing them under military discipline."
 venezuela.242.a:0 "Unleash the colectivos across the nation!"
 venezuela.242.b:0 "Subordinate them to FANB command."
 venezuela.243.t:0 "Financing the Bolivarian Missions"
 venezuela.243.d:0 "Massive social missions are draining state coffers faster than oil exports can cover. The Finance Ministry warns we must either issue massive sovereign debt or raid PDVSA's capital reserves."
 venezuela.243.a:0 "Print money and issue sovereign debt!"
 venezuela.243.b:0 "Drain PDVSA's reserves to pay the bill."
