 venezuela.235.t:0 "The Purge of Caracas"
 venezuela.235.d:0 "Security forces have surrounded the estates and ministries of the old political elite. Our commanders ask whether to liquidate their assets immediately for the war machine or spare compliant technocrats to serve the new order."
 venezuela.235.a:0 "Seize everything for the state arsenals!"
 venezuela.235.b:0 "Spare the engineers and bind them to the regime."
 venezuela.236.t:0 "Weaponizing the Orinoco"
 venezuela.236.d:0 "With foreign industries nationalized and PDVSA wholly subordinate to the state, Caracas commands an unprecedented river of oil revenue. How shall we direct this black gold?"
 venezuela.236.a:0 "Fill the Imperial War Chest!"
 venezuela.236.b:0 "Fund black-budget intelligence and science!"
 venezuela.237.t:0 "Doctrine of the Bolivarian Axis"
 venezuela.237.d:0 "As the Bolivarian Axis rises in Caracas, the High Command debates how our new bloc will reshape the hemisphere and challenge the great powers."
 venezuela.237.a:0 "Conquest through iron and speed."
 venezuela.237.b:0 "Dominate through petrodollars and subversion."
 venezuela.238.t:0 "A Petro-Bribe from Caracas"
 venezuela.238.d:0 "Envoys from the Bolivarian Axis in Caracas have arrived with massive oil supply contracts and billions in state-backed financing—on the condition that we align with Venezuela's rising bloc."
 venezuela.238.a:0 "Accept Venezuelan oil and join the Axis."
 venezuela.238.b:0 "We will never bow to Caracas!"
 venezuela.239.t:0 "Project Bolivar: The Atom & The Skies"
 venezuela.239.d:0 "Venezuela's top scientists report a breakthrough in our strategic weapons program. We can prioritize a nuclear deterrent or pour resources into aerospace dominance."
 venezuela.239.a:0 "Split the atom—forge a nuclear deterrent!"
 venezuela.239.b:0 "Rule the skies with unmatched aerospace power!"

