 VEN_armor_spearhead: "Punta de Lanza Llanera"
 VEN_armor_spearhead_desc: "Integrar tanques de batalla, IFV y blindaje compuesto en formaciones rápidas de maniobra diseñadas para romper líneas fortificadas."
 VEN_combined_arms_corps: "Cuerpo Blindado de Armas Combinadas"
 VEN_combined_arms_corps_desc: "Unificar regimientos de tanques, IFV anfibios y brigadas motorizadas Tiuna en un cuerpo mecanizado de élite de armas combinadas."
 VEN_cenareca_unlock_tt: "Desbloquea o refuerza la organización militar industrial §YCENARECA§!."
 VEN_cemablin_t72_doctrine_idea: "Doctrina Pesada CEMABLIN"
 VEN_cemablin_t72_doctrine_idea_desc: "Regimientos de tanques pesados de escuela rusa aportan una potencia de choque y ruptura superior."
 VEN_norinco_vn16_amphibious_idea: "Cuerpo Mecanizado Anfibio NORINCO"
 VEN_norinco_vn16_amphibious_idea_desc: "Los blindados chinos VN-1, VN-16 y VN-18 sobresalen en cruces fluviales y asaltos anfibios costeros."
 VEN_amx30_modernization_idea: "Renovación Digital AMX-30VE"
 VEN_amx30_modernization_idea_desc: "Nuevas ópticas, estabilizadores y motores otorgan gran movilidad y resistencia a los tanques occidentales modernizados."
 VEN_llanos_cavalry_mobility_idea: "Caballería Blindada de los Llanos"
 VEN_llanos_cavalry_mobility_idea_desc: "Brigadas mecanizadas sobre ruedas 8x8 dominan las llanuras abiertas con bajo consumo logístico."
 VEN_tiuna_motorization_idea: "Motorización Táctica Tiuna"
 VEN_tiuna_motorization_idea_desc: "La estandarización de vehículos utilitarios propios reduce los costos de producción y mejora la fiabilidad y velocidad de marcha."
 VEN_motorized_logistics_idea: "Columnas Tiuna Cazatanques"
 VEN_motorized_logistics_idea_desc: "Pelotones antitanque sobre Tiuna y convoyes dedicados reducen el consumo de suministros y potencian las formaciones motorizadas."
 VEN_cenareca_mass_production_idea: "Ensamblaje Pesado CENARECA"
 VEN_cenareca_mass_production_idea_desc: "Las líneas modernizadas de vehículos blindados aumentan la producción militar y la ganancia de eficiencia fabril."
 VEN_armored_spearhead_idea: "Punta de Lanza Blindada"
 VEN_armored_spearhead_idea_desc: "Las formaciones blindadas concentradas golpean con velocidad, potencia de fuego y capacidad de ruptura superiores."
 VEN_combined_arms_corps_idea: "Cuerpo Blindado de Armas Combinadas"
 VEN_combined_arms_corps_idea_desc: "Tanques, IFV e infantería motorizada combaten como un solo puño cohesionado en cualquier teatro de operaciones."
 VEN_codai_air_defense_idea: "Defensa Aérea Integrada CODAI"
 VEN_codai_air_defense_idea_desc: "Baterías SAM en capas y radares de alerta temprana protegen el espacio aéreo venezolano contra ataques hostiles."
 VEN_drone_recon_strike_idea: "Comando Táctico de Drones"
 VEN_drone_recon_strike_idea_desc: "Vehículos aéreos no tripulados de reconocimiento y ataque mejoran el apoyo aéreo cercano y la adquisición de blancos."
 VEN_autonomous_drone_swarm_idea: "Enjambres Autónomos CAVIM"
 VEN_autonomous_drone_swarm_idea_desc: "Drones autónomos y municiones merodeadoras saturan las defensas enemigas y multiplican el apoyo aéreo."
 VEN_missile_telecom_shield_idea: "Escudo Electrónico y de Telecomunicaciones"
 VEN_missile_telecom_shield_idea_desc: "Redes de radar protegidas y enlaces cifrados blindan las comunicaciones militares frente a la guerra electrónica."
 VEN_orbital_c4isr_idea: "Constelación Orbital C4ISR"
 VEN_orbital_c4isr_idea_desc: "Satélites propios de comunicaciones y observación aceleran la planificación militar y la investigación tecnológica."
 VEN_aerospace_energy_shield_idea: "Escudo Aeroespacial de Energía Dirigida"
 VEN_aerospace_energy_shield_idea_desc: "Láseres antidrones de nueva generación y baterías CODAI integradas crean un paraguas antiaéreo impenetrable."
 VEN_fiscal_overheating_debuff: "Sobrecalentamiento Fiscal y Presión de Obra"
 VEN_fiscal_overheating_debuff_desc: "El volumen simultáneo de obras públicas y subsidios industriales tensiona las finanzas del Estado, el consumo y el costo de la deuda."
 VEN_megaproject_debt_strain: "Carga Financiera de Megaproyectos"
 VEN_megaproject_debt_strain_desc: "Las inversiones monumentales en industrias estratégicas y tecnología de punta presionan temporalmente las cuentas fiscales y los bienes de consumo."
 VEN_global_talent_hub: "Ecosistema de Talento Global e I+D"
 VEN_global_talent_hub_desc: "Universidades, institutos técnicos y parques científicos retienen al talento venezolano y atraen investigadores internacionales."
 VEN_oil_dependency_transition: "Transición Económica Post-Petrolera"
 VEN_oil_dependency_transition_desc: "El capital público y privado migra de la dependencia del crudo hacia la manufactura, minería y servicios diversificados."
 VEN_emirates_of_the_caribbean: "Prosperidad Soberana del Caribe"
 VEN_emirates_of_the_caribbean_desc: "Un fondo soberano maduro y una economía diversificada de alta tecnología consolidan la estabilidad fiscal y el crecimiento."
 VEN_northern_ties: "Lazos con el Norte"
 VEN_northern_ties_desc: "Reorientar la política exterior venezolana hacia Washington y los aliados democráticos del hemisferio."
 VEN_call_washington: "Llamar a Washington"
 VEN_call_washington_desc: "Abrir canales diplomáticos directos con Estados Unidos para reconstruir la confianza bilateral."
 VEN_usa_democratic_transition: "Transición Democrática"
 VEN_usa_democratic_transition_desc: "Restaurar instituciones democráticas, independencia judicial y reconocimiento internacional para aliviar sanciones."
 VEN_our_war_on_drugs: "Operaciones Antinarco"
 VEN_our_war_on_drugs_desc: "Coordinar interdicción fronteriza y marítima con socios regionales contra el narcotráfico."
 VEN_us_recovery_aid: "Ayuda de EE. UU."
 VEN_us_recovery_aid_desc: "Asegurar fondos de reconstrucción y crédito estadounidense para reactivar la industria civil."
 VEN_peace_in_the_caribbean: "Acuerdo del Caribe"
 VEN_peace_in_the_caribbean_desc: "Consolidar un marco de seguridad y comercio prooccidental en la cuenca del Caribe."
 VEN_introduce_western_industries: "Auge de Capital Occidental"
 VEN_introduce_western_industries_desc: "Abrir los mercados financieros e industriales de Venezuela al capital norteamericano y europeo bajo un marco económico dinámico."
 VEN_auto_industries: "Nearshoring y Alta Industria"
 VEN_auto_industries_desc: "Atraer cadenas occidentales automotrices, de compuestos y electrónica hacia los parques industriales venezolanos."
 VEN_usa_oil_privatization: "Empresas Mixtas Petroleras"
 VEN_usa_oil_privatization_desc: "Negociar concesiones de crudo pesado y aguas profundas en Maracaibo y el Orinoco con petroleras occidentales."
 VEN_port_of_puerto_cabello: "Logística de Puerto Cabello"
 VEN_port_of_puerto_cabello_desc: "Modernizar las terminales portuarias, el turismo costero y los astilleros DIANCA para el comercio atlántico."
 VEN_purging_corrupt_officials: "Estado de Derecho y Auditoría"
 VEN_purging_corrupt_officials_desc: "Purgar la corrupción arraigada, proteger la seguridad jurídica y blindar las instituciones frente a presiones externas."
 VEN_army_westernization: "Ejército Occidental"
 VEN_army_westernization_desc: "Reformar la formación de oficiales y la doctrina conjunta bajo estándares profesionales occidentales."
 VEN_us_import_policy: "Importaciones de EE. UU."
 VEN_us_import_policy_desc: "Negociar paquetes de Ventas Militares Extranjeras y armamento moderno estadounidense."
 VEN_nato_standards: "Estandarización OTAN"
 VEN_nato_standards_desc: "Adoptar logística, comunicaciones y doctrina de combate terrestre bajo estándares de la OTAN."
 VEN_establish_us_military_base: "Bases Conjuntas EE. UU."
 VEN_establish_us_military_base_desc: "Autorizar instalaciones aéreas y navales compartidas en Zulia y Sucre para defensa hemisférica."
 VEN_major_non_nato_partner: "Aliado No-OTAN"
 VEN_major_non_nato_partner_desc: "Formalizar un pacto bilateral de defensa con Washington y obtener el estatus de Aliado Mayor No-OTAN."
 VEN_join_nato: "Ingresar a la OTAN"
 VEN_join_nato_desc: "Formalizar el ingreso pleno de Venezuela en la Organización del Tratado del Atlántico Norte con respaldo de EE. UU."
 VEN_joint_weapon_system_lab: "I+D Militar Conjunto"
 VEN_joint_weapon_system_lab_desc: "Crear laboratorios compartidos de ingeniería aeroespacial y armamento con contratistas occidentales."
 VEN_fifth_gen_fighter: "Cazas de 5.ª Generación"
 VEN_fifth_gen_fighter_desc: "Adquirir cazas F-35A Lightning II para asegurar supremacía aérea absoluta en el Caribe."
 VEN_caribbean_intervention: "Doctrina Intervencionista"
 VEN_caribbean_intervention_desc: "Adoptar una doctrina expedicionaria proactiva respaldada por EE. UU. para proyectar poder regional."
 VEN_cuba_embargo_ops: "Contener a La Habana"
 VEN_cuba_embargo_ops_desc: "Aplicar bloqueo naval, inteligencia y aislamiento diplomático contra el régimen cubano."
 VEN_esequibo_us_arbitration: "Disuasión en el Esequibo"
 VEN_esequibo_us_arbitration_desc: "Fortificar la frontera oriental y respaldar la postura estratégica venezolana en el Esequibo."
 VEN_liberate_cuba: "Operación Habana Libre"
 VEN_liberate_cuba_desc: "Lanzar una expedición anfibia apoyada por EE. UU. para derrocar al régimen comunista de La Habana."
 VEN_anti_cartel_crusade: "Ofensiva Regional"
 VEN_anti_cartel_crusade_desc: "Ampliar fábricas militares y preparar operaciones decisivas contra rivales regionales hostiles."
 VEN_caribbean_hegemon: "Bastión Occidental"
 VEN_caribbean_hegemon_desc: "Consolidar a Venezuela como la principal potencia militar respaldada por EE. UU. en el Caribe."
 VEN_us_backed_intervention: "Doctrina Expedicionaria EE. UU."
 VEN_us_backed_intervention_desc: "Inteligencia, logística y planificación estadounidense aceleran las operaciones ofensivas."
 VEN_caracas_financial_hub: "Centro Financiero de Caracas"
 VEN_caracas_financial_hub_desc: "Convertir a Caracas en sede corporativa y centro bancario regional respaldado por inversores institucionales occidentales."
 VEN_western_grid_modernization: "Red Eléctrica Moderna"
 VEN_western_grid_modernization_desc: "Asociarse con firmas occidentales para ampliar energías renovables y reforzar la red eléctrica nacional."
 VEN_caribbean_economic_tiger: "Tigre Económico del Caribe"
 VEN_caribbean_economic_tiger_desc: "Consolidar a Venezuela como una economía caribeña de alto crecimiento y grado de inversión."
 VEN_western_economic_boom_modifier: "Marco Económico Occidental"
 VEN_western_economic_boom_modifier_desc: "Reformas económicas dinámicas, incentivos fiscales y flujos de inversión extranjera directa que transforman la economía venezolana."
 VEN_western_boom_updated_tt: "Actualiza los modificadores de §YMarco Económico Occidental§!."
 venezuela.220.t: "El Modelo de Capital Occidental"
 venezuela.220.d: "Con inversores occidentales llamando a la puerta de Caracas, nuestro gabinete económico debe elegir el marco regulatorio para la inversión extranjera."
 venezuela.220.a: "Desregulación Wall Street y Rebaja Fiscal"
 venezuela.220.b: "Pacto Industrial Social-Mercado Europeo"
 venezuela.220.c: "Zonas Económicas Especiales Soberanas"
 venezuela.221.t: "Términos en Maracaibo y el Orinoco"
 venezuela.221.d: "Las grandes petroleras de EE. UU. ofrecen invertir miles de millones en nuestros campos, según el reparto accionarial y de control que fijemos."
 venezuela.221.a: "Concesión Mayoritaria a Petroleras de EE. UU."
 venezuela.221.b: "Imponer Empresas Mixtas 51/49"
 VEN_joint_c4isr_network: "Red Conjunta C4ISR y Escudo Radar"
 VEN_joint_c4isr_network_desc: "Integrar los radares de defensa aérea, las comunicaciones tácticas y el reconocimiento venezolano bajo estándares OTAN Link-16."
 VEN_nato_rapid_reaction_corps: "Brigada de Reacción Rápida OTAN"
 VEN_nato_rapid_reaction_corps_desc: "Formar brigadas de élite aeromóviles y de operaciones especiales entrenadas bajo estándares OTAN para despliegue rápido en el Caribe."
 VEN_nato_joint_command_modifier: "Integración de Mando Conjunto OTAN"
 VEN_nato_cmd_updated_tt: "Actualiza el modificador dinámico §YIntegración de Mando Conjunto OTAN§!."
 venezuela.222.t: "Reforma Doctrinal STANAG y Mando Conjunto"
 venezuela.222.d: "Al adoptar los acuerdos de estandarización de la OTAN, el Alto Mando debe elegir el pilar operacional de nuestra nueva doctrina."
 venezuela.222.a: "Batalla Aeroterrestre y Maniobra Mecanizada"
 venezuela.222.b: "Reacción Rápida Aeromóvil y Fuerzas Especiales"
 venezuela.222.c: "Escudo Aeronaval Conjunto del Caribe"
 venezuela.223.t: "Tratado de Base Avanzada del SOUTHCOM"
 venezuela.223.d: "Washington está listo para firmar el protocolo de uso de bases aéreas y navales en Venezuela. ¿Qué alcance tendrá la presencia estadounidense?"
 venezuela.223.a: "Base Conjunta Soberana Equilibrada"
 venezuela.223.b: "Fortaleza del Caribe Financiada por EE. UU."
 venezuela.223.c: "Centro Rotativo de Asesoría de Baja Huella"
 VEN_hemispheric_realignment_idea: "Realineamiento Hemisférico"
 VEN_hemispheric_realignment_idea_desc: "Caracas ha girado nuevamente hacia las instituciones democráticas y las alianzas diplomáticas occidentales en América."
 VEN_caribbean_accord_idea: "Acuerdo Democrático del Caribe"
 VEN_caribbean_accord_idea_desc: "Un marco prooccidental de comercio, seguridad y diplomacia que consolida la estabilidad venezolana y la cooperación regional."
 VEN_usa_authoritarian_pact: "Pacto de Seguridad Nacional"
 VEN_usa_authoritarian_pact_desc: "Forjar una alianza pragmática de seguridad con Washington, dejando atrás instituciones débiles en favor de una autoridad nacionalista centralizada."
 VEN_iron_fist_crackdown: "Mano Dura contra el Crimen"
 VEN_iron_fist_crackdown_desc: "Desplegar fuerzas militarizadas para aplastar a los cárteles, desmantelar redes guerrilleras y purgar intermediarios corruptos."
 VEN_sovereign_resource_deals: "Concesiones Estratégicas"
 VEN_sovereign_resource_deals_desc: "Otorgar contratos petroleros y de infraestructura supervisados por el Estado a firmas estadounidenses a cambio de divisas y alivio de sanciones."
 VEN_national_order_doctrine: "Doctrina de Orden Nacional"
 VEN_national_order_doctrine_desc: "Consolidar un Estado nacionalista disciplinado y prooccidental, anclado en el orden interno, la industria y la preparación militar."
 VEN_nationalist_state_capitalism: "Capitalismo de Estado Estratégico"
 VEN_nationalist_state_capitalism_desc: "Dirigir el crédito estatal y los ingresos externos hacia la industria militar y la manufactura pesada nacional."
 VEN_militarize_orinoco_mining: "Militarizar el Arco Minero"
 VEN_militarize_orinoco_mining_desc: "Poner el Arco Minero del Orinoco bajo supervisión de ingeniería militar para expandir la producción de acero, tungsteno y aluminio."
 VEN_sovereign_arms_complex: "Complejo Armamentístico Nacional"
 VEN_sovereign_arms_complex_desc: "Expandir los arsenales de CAVIM y CENARECA hacia una base industrial de defensa autosuficiente."
 VEN_fortress_economy: "Economía de Fortaleza"
 VEN_fortress_economy_desc: "Blindar los sectores estratégicos frente a presiones políticas externas mientras se extirpa la corrupción burocrática."
 VEN_praetorian_high_command: "Alto Mando Pretoriano"
 VEN_praetorian_high_command_desc: "Elevar al Estado Mayor al centro de la estrategia nacional y modernizar el mando de armas combinadas."
 VEN_us_black_ops_liaison: "Enlace Contrainsurgente con EE. UU."
 VEN_us_black_ops_liaison_desc: "Cooperar con asesores de operaciones especiales estadounidenses para erradicar los últimos bastiones narcos e insurgentes."
 VEN_nationalist_officer_corps: "Cuerpo de Oficiales Nacionalistas"
 VEN_nationalist_officer_corps_desc: "Forjar un cuerpo de oficiales agresivo y leal, adiestrado en doctrina ofensiva rápida."
 VEN_hemispheric_security_shield: "Escudo de Seguridad Hemisférica"
 VEN_hemispheric_security_shield_desc: "Asegurar una garantía de defensa bilateral con EE. UU. y levantar una red integrada de radares y defensa aérea en el norte."
 VEN_monroe_junior_partner: "Doctrina Monroe Regional"
 VEN_monroe_junior_partner_desc: "Posicionar a Venezuela como el brazo ejecutor anticomunista de Washington en la cuenca del Caribe."
 VEN_reclaim_esequibo_by_force: "Recuperación Armada del Esequibo"
 VEN_reclaim_esequibo_by_force_desc: "Respaldar nuestro reclamo histórico sobre la Guayana Esequiba con movilización militar decisiva."
 VEN_crush_caribbean_left: "Contención Anticomunista del Caribe"
 VEN_crush_caribbean_left_desc: "Proyectar poder contra regímenes izquierdistas hostiles en el Caribe y Centroamérica."
 VEN_caribbean_iron_hegemon: "Hegemón Férreo del Caribe"
 VEN_caribbean_iron_hegemon_desc: "Imponer un dominio militar y geopolítico incontestable en todo el Caribe meridional."
 VEN_continental_caudillo_doctrine: "Doctrina del Caudillo Continental"
 VEN_continental_caudillo_doctrine_desc: "Culminar la transformación de Venezuela en una potencia nacionalista disciplinada, industrializada y fuertemente armada."
 VEN_national_security_state_modifier: "Estado de Seguridad Nacional"
 VEN_nss_updated_tt: "Actualiza el modificador dinámico §YEstado de Seguridad Nacional§!."
 VEN_caribbean_iron_hegemon_idea: "Hegemón Férreo del Caribe"
 VEN_caribbean_iron_hegemon_idea_desc: "Un orden regional militarizado basado en movilización rápida, fervor nacionalista y ambición territorial."
 venezuela.224.t: "El Pacto de Seguridad Nacional"
 venezuela.224.d: "Con Washington priorizando la estabilidad regional sobre las formalidades liberales, el Alto Mando y los líderes nacionalistas deben definir la estructura del nuevo régimen."
 venezuela.224.a: "Instaurar una Junta Cívico-Militar Prooccidental"
 venezuela.224.b: "Establecer un Presidencialismo Nacionalista de Mano Dura"
 venezuela.224.c: "Consolidar una Autocracia Tecnocrática Occidental"
 VEN_reverse_brain_drain_west: "Retorno de la Diáspora"
 VEN_reverse_brain_drain_west_desc: "Ofrecer incentivos fiscales, becas y garantías institucionales para traer de vuelta a ingenieros, médicos y científicos venezolanos."
 VEN_silicon_caracas_hub: "Silicon Caracas"
 VEN_silicon_caracas_hub_desc: "Transformar el distrito financiero de la capital en un polo tecnológico, de semiconductores y servicios digitales respaldado por Occidente."
 VEN_nato_caribbean_fleet_base: "Flota Conjunta OTAN del Caribe"
 VEN_nato_caribbean_fleet_base_desc: "Ampliar los astilleros venezolanos como base avanzada de logística naval y patrulla antisubmarina de la OTAN."
 VEN_joint_aerospace_shield: "Escudo Aeroespacial del Atlántico"
 VEN_joint_aerospace_shield_desc: "Desplegar radares occidentales, baterías antiaéreas y bases aéreas fortificadas en todo el norte de Venezuela."
 VEN_andean_democratic_shield: "Pacto Democrático Andino-Caribeño"
 VEN_andean_democratic_shield_desc: "Liderar una coalición regional de naciones democráticas en el norte de Sudamérica y el Caribe."
 VEN_liberate_nicaragua_and_haiti: "Operación Estabilidad Hemisférica"
 VEN_liberate_nicaragua_and_haiti_desc: "Proyectar fuerzas expedicionarias y de estabilización contra focos autoritarios e inestables en la cuenca del Caribe."
 VEN_beacon_of_the_americas: "Faro Democrático de las Américas"
 VEN_beacon_of_the_americas_desc: "Culminar el renacimiento democrático venezolano como potencia próspera, segura y tecnológicamente avanzada."
 VEN_beacon_of_americas_idea: "Faro de las Américas"
 VEN_beacon_of_americas_idea_desc: "Una potencia democrática próspera que combina capital occidental, talento retornado y defensa estándar OTAN."
 VEN_national_petrochemical_titan: "Titán Petroquímico Estatal"
 VEN_national_petrochemical_titan_desc: "Movilizar capital estatal y tecnología occidental de perforación para convertir Maracaibo en un gigante energético."
 VEN_military_autarky_grid: "Red Energética y Logística Blindada"
 VEN_military_autarky_grid_desc: "Fortificar autopistas, oleoductos y plantas de munición en el corazón del país para sostener movilizaciones prolongadas."
 VEN_state_tech_directorate: "Dirección Estatal de Tecnología"
 VEN_state_tech_directorate_desc: "Integrar a ingenieros e industriales bajo dirección de seguridad nacional para eliminar la dependencia tecnológica."
 VEN_armored_caudillo_legions: "Legiones Blindadas y Artillería"
 VEN_armored_caudillo_legions_desc: "Expandir las líneas de blindados de CENARECA y brigadas de artillería pesada para maniobra decisiva."
 VEN_caribbean_iron_armada: "Armada Férrea del Caribe"
 VEN_caribbean_iron_armada_desc: "Reconstruir los astilleros de DIANCA para proyectar poder naval incontestable en el Caribe meridional."
 VEN_strategic_missile_command: "Comando de Misiles y Drones"
 VEN_strategic_missile_command_desc: "Crear un comando centralizado aeroespacial y de ataque de precisión apoyado en la producción de drones de CAVIM."
 VEN_caribbean_protectorates: "Sistema de Protectorados"
 VEN_caribbean_protectorates_desc: "Imponer protectorados de seguridad alineados con Caracas sobre las repúblicas insulares vecinas."
 VEN_propaganda_and_youth_corps: "Cuerpos Juveniles Patrióticos"
 VEN_propaganda_and_youth_corps_desc: "Inculcar disciplina nacional, movilización de reservas y lealtad patriótica en la juventud venezolana."
 VEN_caribbean_security_council: "Consejo de Seguridad del Caribe"
 VEN_caribbean_security_council_desc: "Centralizar la inteligencia regional, la policía antisubversiva y el mando diplomático en Caracas."
 VEN_nationalist_youth_corps_idea: "Cuerpos Juveniles Patrióticos"
 VEN_nationalist_youth_corps_idea_desc: "Movilización juvenil organizada por el Estado que acelera el reclutamiento y el fervor bélico."
 VEN_continental_caudillo_idea: "Estado del Caudillo Continental"
 VEN_continental_caudillo_idea_desc: "Un bastión nacionalista fuertemente armado e industrializado que domina el Caribe."
 venezuela.225.t: "Respaldo de EE. UU. sobre el Esequibo"
 venezuela.225.d: "Con el respaldo diplomático y estratégico de Washington, Caracas puede presionar a Georgetown para una entrega inmediata de la Guayana Esequiba o exigir la integración total de Guyana."
 venezuela.225.a: "Exigir Arbitraje Estadounidense por el Esequibo"
 venezuela.225.b: "Exigir Integración Total de Guyana con Apoyo Militar de EE. UU."
 venezuela.226.t: "Washington Presiona a Georgetown"
 venezuela.226.d: "Caracas ha presentado un ultimátum respaldado por Estados Unidos exigiendo cesiones territoriales. Georgetown debe decidir entre ceder al arbitraje o ir a la guerra."
 venezuela.226.a: "Ceder ante el Arbitraje Estadounidense"
 venezuela.226.b: "Rechazar el Ultimátum y Resistir"
 VEN_us_tutelage_modifier: "Tutela de Washington"
 VEN_us_tutelage_updated_tt: "Actualiza el modificador dinámico §YTutela de Washington§!."
 VEN_us_tutelage_removed_tt: "Pone fin a la §YTutela de Washington§!, eliminando todas las penalizaciones de supervisión política y económica de EE. UU."
 venezuela.227.t: "Las Condiciones de la Embajada"
 venezuela.227.d: "El embajador estadounidense en Caracas ha entregado una lista estricta de exigencias políticas y de seguridad a cambio del respaldo de Washington, tratando a Venezuela como un socio menor tutelado."
 venezuela.227.a: "Aceptar la Tutela de Washington"
 venezuela.227.b: "Exigir Soberanía de Socio Igual"
 venezuela.228.t: "Auditores del FMI y del Tesoro"
 venezuela.228.d: "Los asesores financieros estadounidenses exigen supervisar directamente las cuentas de los ministerios y los ingresos energéticos antes de liberar los fondos."
 venezuela.228.a: "Aceptar los Auditores de EE. UU."
 venezuela.228.b: "Caracas Controla su Propio Presupuesto"
 venezuela.229.t: "Disputa de Mando con el SOUTHCOM"
 venezuela.229.d: "Los generales del Pentágono exigen derecho de veto operacional sobre nuestras bases conjuntas y despliegues en el Caribe."
 venezuela.229.a: "Subordinarse al Mando del SOUTHCOM"
 venezuela.229.b: "Exigir Igualdad de Mando"
 venezuela.230.t: "El Precio de Washington"
 venezuela.230.d: "Tras años de créditos, armas y respaldo estadounidense, Washington no piensa soltar las riendas de Caracas fácilmente. Romper la tutela ahora provocará una crisis diplomática directa."
 venezuela.230.a: "Seguir como Socio Subalterno de EE. UU."
 venezuela.230.b: "Romper la Tutela — Riesgo de Intervención de EE. UU."
 VEN_us_asset_freeze_shock_idea: "Congelación de Activos y Choque Económico"
 VEN_us_asset_freeze_shock_idea_desc: "Washington ha congelado reservas venezolanas, revocado licencias y reimpuesto sanciones punitivas tras la ruptura de Caracas."
 VEN_us_benefits_stripped_tt: "§RRevoca toda ayuda, misiones militares y privilegios estadounidenses; ¡Washington obtiene un objetivo bélico para recuperar sus activos!§!"
 american_guardian_pact: "Pacto del Guardián Americano"
